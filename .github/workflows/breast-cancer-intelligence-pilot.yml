name: Breast cancer intelligence pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'breast_cancer_intelligence/**'
      - '.github/workflows/breast-cancer-intelligence-pilot.yml'
permissions:
  contents: read
jobs:
  collect-public-research-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s breast_cancer_intelligence/tests -v
      - name: Live API connectivity checks
        run: python breast_cancer_intelligence/smoke_real_apis.py
      - name: Collect real timestamped research snapshots
        run: python breast_cancer_intelligence/collect_public_intelligence.py
      - name: Preserve immutable bundle and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bci-data-validation-${{ github.run_id }}
          path: |
            breast_cancer_intelligence/data_snapshots/*.zip
            breast_cancer_intelligence/data_snapshots/*/manifest.json
            breast_cancer_intelligence/smoke_report.json
          if-no-files-found: warn
          retention-days: 14
