name: astock-quant - Drive-first strategy

on:
  # Market Gold refresh + state snapshot, nightly 23:50 in UTC+8.
  schedule:
    - cron: '50 15 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: "Task; results saved on Google Drive, never Git"
        required: true
        type: choice
        options:
          - preflight
          - tests
          - current-state
          - forward-baseline
          - ownership-refresh
          - gold-refresh
          - backup-repo-data
      as_of:
        description: "State date YYYY-MM-DD, or auto from Gold manifest"
        required: false
        default: "auto"
        type: string
      min_as_of:
        description: "Optional minimum Gold trading date YYYY-MM-DD"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: stock-strategy-drive-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        if: inputs.task != 'backup-repo-data'
        run: python -m pip install --require-hashes -r astock-quant/stock_state_strategy/requirements.txt
      - name: Install rclone and configure Google Drive
        if: inputs.task != 'tests'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GDRIVE_RCLONE_CONFIG_B64" ]]; then
            echo "::error::Actions secret GDRIVE_RCLONE_CONFIG_B64 is missing."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          config_file="$RUNNER_TEMP/rclone.conf"
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$config_file")
          echo "RCLONE_CONFIG=$config_file" >> "$GITHUB_ENV"
          rclone --config "$config_file" listremotes | grep -qx 'gdrive:'
      - name: Execute isolated task and save outputs to Google Drive
        if: github.event_name == 'workflow_dispatch'
        working-directory: astock-quant/stock_state_strategy
        # Inputs go through env, never into the script text, so a crafted value
        # cannot be executed by the shell. The runner validates every value.
        env:
          TASK: ${{ inputs.task }}
          AS_OF: ${{ inputs.as_of }}
          MIN_AS_OF: ${{ inputs.min_as_of }}
        run: |
          python github_drive_runner.py "$TASK" \
            --as-of "$AS_OF" \
            --min-as-of "$MIN_AS_OF"
      - name: Nightly validated Gold refresh and latest state snapshot
        if: github.event_name == 'schedule'
        working-directory: astock-quant/stock_state_strategy
        shell: bash
        run: |
          set -euo pipefail
          python github_drive_runner.py gold-refresh --as-of auto
          python github_drive_runner.py current-state --as-of auto
