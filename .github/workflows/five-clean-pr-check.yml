name: Five Clean backfill - safe PR checks

on:
  pull_request:
    paths:
      - 'ai_research/five_clean_backfill.py'
      - 'ai_research/tests/test_five_clean_backfill.py'
      - '.github/workflows/five-clean-backfill.yml'
      - '.github/workflows/five-clean-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-mock-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install offline data schema dependencies
        run: python -m pip install --require-hashes -r requirements/research-pandas2.txt
      - name: Validate 40 of 40 mock cases and fail-closed on missing records
        run: python -m unittest discover -s ai_research/tests -p test_five_clean_backfill.py -v
