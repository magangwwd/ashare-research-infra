name: One-time research A-pool ranking (2026-10-09)

on:
  push:
    branches:
      - research/rank-a-watchlist-20261011
    paths:
      - '.github/workflows/research-a-pool-watchlist-once.yml'

permissions:
  contents: read

jobs:
  research-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test ranking rules offline
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_rank_a_watchlist.py
      - name: Restore authorized Google Drive configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::Missing Drive Secret"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          rclone --config "$RUNNER_TEMP/rclone.conf" listremotes | grep -qx 'gdrive:'
      - name: Fetch original verified A-pool from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto gdrive:stock_state_strategy/output/state_definition_20261009/a_strategy_pool.csv "$RUNNER_TEMP/a_strategy_pool.csv"
          test -s "$RUNNER_TEMP/a_strategy_pool.csv"
      - name: Rank original 134 A candidates without changing their membership
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/rank_a_watchlist.py \
            --input "$RUNNER_TEMP/a_strategy_pool.csv" \
            --output-dir "$RUNNER_TEMP/research_watchlist_20261009" \
            --as-of 2026-10-09 --top 20
      - name: Save and verify four outputs on Google Drive
        shell: bash
        run: |
          set -euo pipefail
          dest="gdrive:stock_state_strategy/output/research_watchlist_20261009"
          rclone copy "$RUNNER_TEMP/research_watchlist_20261009" "$dest" --transfers 4 --checkers 8
          rclone check "$RUNNER_TEMP/research_watchlist_20261009" "$dest" --one-way --checkers 8
          rclone cat "$dest/ranking_summary.json"
          echo "WATCHLIST_ONLY: no Git commits, no real trades, Drive-only results."
