name: BTC Regime Router - daily shadow research

on:
  pull_request:
    paths:
      - "btc-quant/regime/**"
      - "btc-quant/config/regime_router_20261016.json"
      - "btc-quant/tests/test_regime_router.py"
      - "btc-quant/tests/test_hmg_safety.py"
      - "btc-quant/tests/test_router_stage1.py"
      - "btc-quant/tests/test_vol_risk_study.py"
      - "btc-quant/tests/test_vol_noadd_reentry.py"
      - "btc-quant/tests/test_archive_freshness.py"
      - "btc-quant/data/select_available_day.py"
      - ".github/workflows/btc-regime-router.yml"
  push:
    branches: [main]
    paths:
      - "btc-quant/regime/**"
      - "btc-quant/config/regime_router_20261016.json"
      - "btc-quant/tests/test_regime_router.py"
      - "btc-quant/tests/test_hmg_safety.py"
      - "btc-quant/tests/test_router_stage1.py"
      - "btc-quant/tests/test_vol_risk_study.py"
      - "btc-quant/tests/test_vol_noadd_reentry.py"
      - "btc-quant/tests/test_archive_freshness.py"
      - "btc-quant/data/select_available_day.py"
      - ".github/workflows/btc-regime-router.yml"
  schedule:
    - cron: "50 2 * * *"
    - cron: "50 8 * * *" # second publication check, Beijing 16:50
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-regime-router-daily
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run complete BTC test suite
        run: python -m unittest discover -s btc-quant/tests -v

  daily-shadow:
    if: github.event_name != 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Connect existing BTC Quant Drive folder
        env:
          GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || {
            echo "::error::Missing existing Drive configuration; fail closed."
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          source='gdrive:BTC_Quant_System_OKX/BTC_V3_第三轮回测_20261014'
          rclone --config "$RUNNER_TEMP/rclone.conf" lsf "$source/" --files-only > "$RUNNER_TEMP/drive_listing.txt"
          base='native_daily_run_38670182049_1__btc_daily_utc.csv'
          grep -Fx "$base" "$RUNNER_TEMP/drive_listing.txt" >/dev/null
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto "$source/$base" "$RUNNER_TEMP/frozen_base.csv"

      - name: Verify published UTC archive without pretending stale data is current
        run: |
          set -euo pipefail
          python btc-quant/data/select_available_day.py \
            --output "$RUNNER_TEMP/source_availability.json" \
            --github-env "$GITHUB_ENV" \
            --max-lag 3

      - name: Extend canonical Binance UTC 1D data with original daily archives
        run: |
          set -euo pipefail
          python btc-quant/data/extend_daily.py \
            --base "$RUNNER_TEMP/frozen_base.csv" \
            --out "$RUNNER_TEMP/current_data" \
            --cache "$RUNNER_TEMP/daily_archives" \
            --end "$LATEST_CLOSED_UTC"

      - name: Run leakage-safe regime router
        run: |
          set -euo pipefail
          python btc-quant/regime/router.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --config btc-quant/config/regime_router_20261016.json \
            --out "$RUNNER_TEMP/regime"

      - name: Run HMG at 1x and 2x transaction-cost stress
        run: |
          set -euo pipefail
          python btc-quant/regime/hmg.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --regime-csv "$RUNNER_TEMP/regime/regime_history.csv" \
            --out "$RUNNER_TEMP/hmg_1x" \
            --cost-multiplier 1
          python btc-quant/regime/hmg.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --regime-csv "$RUNNER_TEMP/regime/regime_history.csv" \
            --out "$RUNNER_TEMP/hmg_2x" \
            --cost-multiplier 2

      - name: Run existing V3 diagnostic and guarded baseline
        run: |
          set -euo pipefail
          python btc-quant/backtest/run.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --out "$RUNNER_TEMP/v3"

      - name: Build historical regime validation package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validation"
          python btc-quant/regime/validate.py \
            --daily "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --regime-csv "$RUNNER_TEMP/regime/regime_history.csv" \
            --out "$RUNNER_TEMP/validation" \
            --v3-equity "$RUNNER_TEMP/v3/v3_diagnostic_1x_cost_equity.csv" \
            --hmg-equity "$RUNNER_TEMP/hmg_1x/hmg_equity.csv"

      - name: Rolling 730/90 R0/R1 shared-account stage-one experiment
        run: |
          set -euo pipefail
          python btc-quant/regime/r1_experiment.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --config btc-quant/config/regime_router_20261016.json \
            --out "$RUNNER_TEMP/stage1"

      - name: Evaluate volatility-risk overlays against verified VOL_STATIC and V3
        run: |
          set -euo pipefail
          python btc-quant/regime/vol_risk_study.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --out "$RUNNER_TEMP/vol_risk"

      - name: Study deep-drawdown buy veto and staged soft-protection recovery
        run: |
          set -euo pipefail
          python btc-quant/regime/vol_noadd_reentry_study.py \
            --input "$RUNNER_TEMP/current_data/btc_daily_utc.csv" \
            --reference-dir "$RUNNER_TEMP/vol_risk" \
            --out "$RUNNER_TEMP/vol_reentry"

      - name: Assemble immutable daily evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/persist"
          asof="$LATEST_CLOSED_UTC"
          prefix="btc_router_${asof}__run_${GITHUB_RUN_ID}"
          cp "$RUNNER_TEMP/regime/latest_regime.json" "$RUNNER_TEMP/persist/${prefix}__latest_regime.json"
          cp "$RUNNER_TEMP/regime/regime_history.csv" "$RUNNER_TEMP/persist/${prefix}__history.csv"
          cp "$RUNNER_TEMP/regime/feature_history.csv" "$RUNNER_TEMP/persist/${prefix}__features.csv"
          cp "$RUNNER_TEMP/hmg_1x/hmg_summary.json" "$RUNNER_TEMP/persist/${prefix}__hmg_1x.json"
          cp "$RUNNER_TEMP/hmg_2x/hmg_summary.json" "$RUNNER_TEMP/persist/${prefix}__hmg_2x.json"
          cp "$RUNNER_TEMP/validation/validation_summary.json" "$RUNNER_TEMP/persist/${prefix}__descriptive_validation.json"
          cp "$RUNNER_TEMP/validation/regime_coverage.csv" "$RUNNER_TEMP/persist/${prefix}__coverage.csv"
          cp "$RUNNER_TEMP/validation/forward_regime_behavior.csv" "$RUNNER_TEMP/persist/${prefix}__forward_behavior.csv"
          cp "$RUNNER_TEMP/validation/conditional_strategy_matrix.csv" "$RUNNER_TEMP/persist/${prefix}__conditional_matrix.csv"
          cp "$RUNNER_TEMP/current_data/data_provenance.json" "$RUNNER_TEMP/persist/${prefix}__data_provenance.json"
          cp "$RUNNER_TEMP/source_availability.json" "$RUNNER_TEMP/persist/${prefix}__source_availability.json"
          cp "$RUNNER_TEMP/current_data/btc_daily_utc.csv" "$RUNNER_TEMP/persist/${prefix}__btc_daily_utc.csv"
          cp "$RUNNER_TEMP/daily_archives/BTCUSDT-1d-${asof}.zip" "$RUNNER_TEMP/persist/${prefix}__official_source_BTCUSDT-1d-${asof}.zip"
          cp btc-quant/config/regime_router_20261016.json "$RUNNER_TEMP/persist/${prefix}__router_config.json"
          for file in "$RUNNER_TEMP/vol_risk/"*; do
            basename="$(basename "$file")"
            cp "$file" "$RUNNER_TEMP/persist/${prefix}__VOL_RISK__${basename}"
          done
          for file in "$RUNNER_TEMP/vol_reentry/"*; do
            basename="$(basename "$file")"
            cp "$file" "$RUNNER_TEMP/persist/${prefix}__VOL_REENTRY__${basename}"
          done
          for file in "$RUNNER_TEMP/stage1/"*; do
            basename="$(basename "$file")"
            cp "$file" "$RUNNER_TEMP/persist/${prefix}__${basename}"
          done
          (
            cd "$RUNNER_TEMP/persist"
            sha256sum ./* > "SHA256SUMS_${GITHUB_RUN_ID}.txt"
          )

      - name: Upload 30-day GitHub evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-regime-router-${{ github.run_id }}
          path: ${{ runner.temp }}/persist/
          retention-days: 30
          if-no-files-found: error

      - name: Append immutable evidence to existing Drive folder
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rclone --config "$RUNNER_TEMP/rclone.conf" copy "$RUNNER_TEMP/persist" 'gdrive:BTC_Quant_System_OKX/' --immutable
          rclone --config "$RUNNER_TEMP/rclone.conf" check "$RUNNER_TEMP/persist" 'gdrive:BTC_Quant_System_OKX/' --one-way --size-only

      - name: Remove Drive credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
