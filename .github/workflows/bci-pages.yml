name: BCI public research website
on:
  push:
    branches: [main]
    paths:
      - 'bci_public_site/**'
      - '.github/workflows/bci-pages.yml'
  pull_request:
    paths:
      - 'bci_public_site/**'
      - '.github/workflows/bci-pages.yml'
  schedule:
    - cron: '15 0 * * *'  # daily around 08:15 Asia/Singapore (GitHub scheduling is best-effort)
  workflow_dispatch:
  workflow_run:
    workflows: ['BCI collect verified source to Drive']
    types: [completed]

concurrency:
  group: bci-public-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-and-verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public metadata and source selector
        run: python -m unittest discover -s bci_public_site/tests -v
      - name: Syntax-check Chinese patient website scripts
        run: |
          node --check bci_public_site/research_cn.js
          node --check bci_public_site/patient.js
          node --check bci_public_site/care.js
          node - <<'NODE'
          const assert=require('assert');
          global.window={};
          require('./bci_public_site/research_cn.js');
          const x=window.BCIChinese.describeArticle({title:'HER2 breast cancer cell line',category:'recent'});
          assert(x.title.includes('中文')||x.title.includes('HER2'));
          assert(x.summary.includes('不能直接')||x.summary.includes('不能'));
          const t=window.BCIChinese.describeTrial({title:'Breast cancer MRI screening',status:'RECRUITING'});
          assert(t.title.includes('检查')||t.title.includes('影像'));
          assert(t.summary.includes('中国'));
          const f=window.BCIChinese.describeFDA({title:'FDA approves drug for HER2 breast cancer'});
          assert(f.summary.includes('不等于中国'));
          console.log('CHINESE_RESEARCH_EXPLAINER_OK');
          NODE
      - name: Refresh website from latest eligible Google Drive snapshot
        if: github.event_name != 'pull_request'
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'google-auth>=2.28,<3' 'requests>=2.31,<3'
          python bci_public_site/scripts/refresh_drive.py \
            --output "$RUNNER_TEMP/bci-latest.zip" \
            --report "$RUNNER_TEMP/bci-drive-check.json"
          python bci_public_site/scripts/build_site.py \
            --zip "$RUNNER_TEMP/bci-latest.zip" \
            --out bci_public_site/data/site-data.json
          python bci_public_site/scripts/refresh_care_guide.py \
            --output bci_public_site/data/care-guide.json \
            --report "$RUNNER_TEMP/bci-care-guide-check.json"
          python -m unittest discover -s bci_public_site/tests -v
      - name: Verify generated site is public-metadata-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('bci_public_site/data/site-data.json').read_text('utf-8'))
          assert d['schemaVersion']==1 and d['articles'] and d['trials']
          guide=json.loads(Path('bci_public_site/data/care-guide.json').read_text('utf-8'))
          assert guide['schema_version']==2 and len(guide['hospitals'])>=10 and guide['journeys'] and guide['frontiers']
          assert sum(1 for h in guide['hospitals'] if h['type']=='军队医院')>=4
          assert len(guide['glossary'])>=10
          assert all(h['sources'] and h['appointment']['checked_at'] and h['checked_at'] for h in guide['hospitals'])
          assert guide['review_status']=='editorial_reference_only_not_medically_reviewed'
          assert all(row.get('url', '').startswith('https://') for row in guide['hospitals'])
          assert all('abstract_for_internal_research_only' not in x for x in d['articles'])
          assert all('patient_name' not in x for x in d['trials'])
          print('PUBLIC_SITE_OK',d['snapshotId'],d['counts'])
          PY
      - name: Create GitHub Pages payload
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp bci_public_site/index.html bci_public_site/patient.js bci_public_site/care.js bci_public_site/research_cn.js bci_public_site/patient.css bci_public_site/care.css bci_public_site/favicon.svg _site/
          cp bci_public_site/.nojekyll _site/.nojekyll
          cp bci_public_site/data/site-data.json bci_public_site/data/care-guide.json _site/data/
          test -s _site/index.html
          test ! -e _site/professional.html
          test -s _site/patient.js
          test -s _site/patient.css
          test -s _site/care.css
          test -s _site/research_cn.js
          test -s _site/care.js
          test -s _site/data/care-guide.json
          test -s _site/data/site-data.json
      - name: Configure existing GitHub Pages site
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build-and-verify.result == 'success' && github.event_name != 'pull_request'
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
