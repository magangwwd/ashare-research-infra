name: Temporary mainboard Task 01 production verification dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task01-mainboard-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  verify-dispatch:
    if: contains(github.event.head_commit.message, 'mainboard production one-time trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger serialized production Task 01
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/task01.yml/dispatches" -f ref=main
          echo "MAINBOARD_TASK01_DISPATCH_ACCEPTED"
