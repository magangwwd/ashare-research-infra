name: Record R0 forward paper signals from a verified new Gold date

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Verified NEW trading date YYYY-MM-DD (>=2026-10-12), never retroactive'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paper-forward-r0-gdrive
  cancel-in-progress: false

jobs:
  paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SOURCE_DATE: ${{ inputs.as_of }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13'}
      - name: Validate request is from genuinely future unseen trading period
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          [[ "$SOURCE_DATE" > '2026-10-11' ]] || { echo "::error::Cannot create backdated forward record"; exit 1; }
      - name: Install paper-only dependencies
        run: python -m pip install --require-hashes -r requirements/research-pandas3.txt
      - name: Run time-direction and historical exchange safety tests
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_research_mainboard_daily_pit_v0.py test_gold_pit_risk_guards.py test_paper_forward_r0.py
      - name: Configure Google Drive without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - name: Require matching Gold source manifest and unique daily ledger
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto 'gdrive:down_data/data/gold/main_board/manifest.json' "$RUNNER_TEMP/gold_manifest.json"
          python - "$RUNNER_TEMP/gold_manifest.json" "$SOURCE_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import date
          j=json.loads(Path(sys.argv[1]).read_text())
          assert j.get("as_of_date")==sys.argv[2], "No exact-dated Gold. Refresh Gold first."
          assert j.get("validation",{}).get("primary_keys_unique") is True
          assert date.today().isoformat()>=sys.argv[2], "Cannot backdate a future ledger"
          PY
          target="gdrive:stock_state_strategy/output/forward_r0/$(printf %s "$SOURCE_DATE")"
          # No repeat/backfill/overwrite: immutable first observation only.
          if rclone lsf "$target" --files-only 2>/dev/null | grep -q .; then
            echo "::error::Ledger date already exists. No duplicate rewrite is allowed."
            exit 1
          fi
      - name: Read only required recent Gold price/factor and exchange risk files
        shell: bash
        run: |
          set -euo pipefail
          for dataset in daily_prices adjustment_factors; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/mainboard/$dataset" \
              --include 'year=2025/**' --include 'year=2026/**' --transfers 8 --checkers 12
          done
          for dataset in daily_limits suspension_events; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/risks/$dataset" \
              --include 'year=2026/**' --transfers 8 --checkers 12
          done
          rclone copyto "gdrive:down_data/data/gold/main_board/name_history.parquet" "$RUNNER_TEMP/risks/name_history/data.parquet"
      - name: Record paper signals at THIS close only, next open unknown
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/paper_forward_r0.py \
            --manifest "$RUNNER_TEMP/gold_manifest.json" \
            --market-root "$RUNNER_TEMP/mainboard" \
            --risk-root "$RUNNER_TEMP/risks" \
            --as-of "$SOURCE_DATE" \
            --output "$RUNNER_TEMP/paper_forward"
      - name: Append-once to Drive and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          target="gdrive:stock_state_strategy/output/forward_r0/$SOURCE_DATE"
          rclone copy "$RUNNER_TEMP/paper_forward" "$target" --immutable --transfers 2 --checkers 4
          rclone check "$RUNNER_TEMP/paper_forward" "$target" --one-way --checkers 4
          echo "PAPER ONLY, CLOSE-OF-DAY SIGNALS. No buy instructions, no intraday prices."
