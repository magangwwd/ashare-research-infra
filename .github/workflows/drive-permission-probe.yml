name: Temporary Drive permission boundary probe
on:
  push:
    paths:
      - '.github/workflows/drive-permission-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-write-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
    steps:
      - name: Probe Google Drive via repository credentials (temporary files only)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GDRIVE_RCLONE_CONFIG_B64:-}" ]]; then echo "::error::rclone Drive secret missing"; exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone > /dev/null
          config_file="$RUNNER_TEMP/drive-probe-rclone.conf"
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$config_file")
          export RCLONE_CONFIG="$config_file"
          rclone listremotes | grep -qx 'gdrive:'
          echo "PASS: GitHub secret loads and gdrive remote exists"
          echo "Checking My Drive root listing without exposing file names"
          rclone lsf 'gdrive:' --dirs-only --max-depth 1 > "$RUNNER_TEMP/root-folder-list.txt"
          echo "PASS: root folder listing; folders=$(wc -l < "$RUNNER_TEMP/root-folder-list.txt")"
          for file in 'Ashare_Quant/current.json' 'down_data/data/gold/main_board/manifest.json' 'stock_state_strategy/runs/38317685633-1/run_status.json'; do
            if rclone cat "gdrive:$file" > /dev/null; then
              echo "PASS: existing file read at $file"
            else
              echo "::warning::Existing file not readable or not found: $file"
            fi
          done
          marker="$RUNNER_TEMP/drive-probe.txt"
          printf 'repository=ashare-research-infra; run=%s; nonce=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$marker"
          remote_name="__ashare_drive_permission_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.txt"
          created=()
          cleanup() {
            local ret=$?
            trap - EXIT
            for remote in "${created[@]}"; do
              if rclone deletefile "$remote"; then echo "PASS: removed temporary test file at $remote"; else echo "::error::failed to delete temporary file at $remote"; ret=1; fi
            done
            exit "$ret"
          }
          trap cleanup EXIT
          for dir in '' 'Ashare_Quant/' 'stock_state_strategy/' 'down_data/'; do
            if ! rclone lsf "gdrive:$dir" --max-depth 1 > /dev/null; then
              echo "::warning::Folder missing or cannot list: $dir"
              continue
            fi
            remote="gdrive:${dir}${remote_name}"
            created+=("$remote")
            rclone copyto "$marker" "$remote"
            rclone cat "$remote" | cmp - "$marker"
            echo "PASS: CREATE + READ exact bytes at gdrive:$dir"
          done
          echo "PASS: root and existing project folders tested; this does NOT prove permissions on every Drive file"
