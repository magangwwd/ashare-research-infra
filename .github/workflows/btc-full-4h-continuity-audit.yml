name: BTC historical 4h complete coverage census (research only)
on:
  push:
    branches: [research/btc-2018-gap-15m-pilot-20261021]
    paths:
      - '.github/workflows/btc-full-4h-continuity-audit.yml'
      - 'btc-quant/data/audit_full_4h_continuity.py'
      - 'btc-quant/tests/test_full_4h_continuity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tests enforcing complete dates and rejecting missing bars
        run: python -m unittest discover -s btc-quant/tests -p 'test_full_4h_continuity.py' -v
      - name: Retrieve unchanged official Binance 4h monthly archives for audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/btc_4h"
          python btc-quant/data/download.py --start 2018-01 --end 2026-09 --out "$RUNNER_TEMP/btc_4h"
      - name: Census every archive month and list contiguous verified UTC-day spans
        run: |
          python btc-quant/data/audit_full_4h_continuity.py \
            --source "$RUNNER_TEMP/btc_4h" --out "$RUNNER_TEMP/btc_4h_coverage.json"
      - name: Retain read-only gap inventory as auditable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-4h-continuity-census-${{ github.run_id }}
          path: ${{ runner.temp }}/btc_4h_coverage.json
          retention-days: 30
          if-no-files-found: warn
