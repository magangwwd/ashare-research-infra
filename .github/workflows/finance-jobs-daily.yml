name: Finance Jobs Daily to Drive
# Paused by user on 2026-10-30: manual execution only; historical data retained.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-jobs-daily
  cancel-in-progress: false
jobs:
  collect-and-archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.28,<3' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate curated records
        run: python -m unittest discover -s finance_jobs_site/tests -v
      - name: Download previous finance snapshot from Google Drive for immutable change journal
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          python finance_jobs_site/scripts/read_drive.py \
            --output "$RUNNER_TEMP/finance-previous.json" \
            --receipt "$RUNNER_TEMP/finance-previous-receipt.json"
      - name: PRIORITY - read legally exported Tencent 2027 recruitment sheet from private Drive
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          python finance_jobs_site/scripts/qq_sheet_sync.py --output "$RUNNER_TEMP/qq-sheet-feed.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"qq-sheet-feed.json").read_text("utf-8"))
          print("QQ_VERIFIED_IMPORT status="+str(d["status"])+" examined="+str(d["rows_examined"])+" leads="+str(d["qualified_count"])+" sha256="+str(d.get("archived_sha256","none")))
          if d["status"]!="authorized_export_imported":
              raise SystemExit("The owner-authorized Tencent XLSX is available in Drive, but import failed")
          if d["rows_examined"]<5000 or d["qualified_count"]<150:
              raise SystemExit("Tencent export imported but row count suspiciously incomplete")
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"qq-sheet-feed.json").read_text("utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("### 腾讯27届秋招汇总表（优先来源）\\n")
            f.write("状态: **"+d["status"]+"** · 有授权导出后筛选: **"+str(d["qualified_count"])+"条**\\n\\n")
            if d["status"]!="authorized_export_imported":
              f.write("**注意：本次未获合法可读的表格副本，未同步表格单元格。**\\n\\n")
          PY
      - name: Check monitored recruiting sources, keeping unverified links separate
        run: python finance_jobs_site/scripts/update_sources.py --config finance_jobs_site/data/opportunities.json --out "$RUNNER_TEMP/source-monitor.json"
      - name: Build immutable detailed finance recruiting JSON
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python finance_jobs_site/scripts/create_snapshot.py \
            --config finance_jobs_site/data/opportunities.json \
            --monitor "$RUNNER_TEMP/source-monitor.json" \
            --previous "$RUNNER_TEMP/finance-previous.json" \
            --qq-feed "$RUNNER_TEMP/qq-sheet-feed.json" \
            --outdir "$RUNNER_TEMP/finance_snapshots" --run-id "$RUN_ID"
      - name: Confirm exactly one snapshot
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          items=("$RUNNER_TEMP"/finance_snapshots/finance_*.json)
          test "${#items[@]}" -eq 1
          printf 'FINANCE_ARCHIVE=%s\n' "${items[0]}" >> "$GITHUB_ENV"
      - name: Upload to dedicated Google Drive and verify SHA256 readback
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          python finance_jobs_site/scripts/publish_drive.py \
            --input "$FINANCE_ARCHIVE" \
            --receipt "$RUNNER_TEMP/finance-drive-receipt.json"
      - name: Retain reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-monitor.json
            ${{ runner.temp }}/qq-sheet-feed.json
            ${{ runner.temp }}/finance-previous-receipt.json
            ${{ runner.temp }}/finance_snapshots/finance_*.json
            ${{ runner.temp }}/finance-drive-receipt.json
          if-no-files-found: warn
          retention-days: 14
