name: BCI public website HTTP smoke
on:
  workflow_run:
    workflows: ['BCI public research website']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: bci-public-http-smoke
  cancel-in-progress: false
jobs:
  verify-public-content:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public pages and published research metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bci_public_check"
          BASE="https://magangwwd.github.io/ashare-research-infra"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/" -o "$RUNNER_TEMP/bci_public_check/patient.html"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/data/site-data.json" -o "$RUNNER_TEMP/bci_public_check/site-data.json"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/data/care-guide.json" -o "$RUNNER_TEMP/bci_public_check/care-guide.json"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/guide.js" -o "$RUNNER_TEMP/bci_public_check/guide.js"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/research_cn.js" -o "$RUNNER_TEMP/bci_public_check/research_cn.js"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/guide.css" -o "$RUNNER_TEMP/bci_public_check/guide.css"
      - name: Verify actual public HTML and cloud research records
        env:
          SOURCE_PATH: ${{ runner.temp }}/bci_public_check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["SOURCE_PATH"])
          patient=(root/"patient.html").read_text(encoding="utf-8")
          data=json.loads((root/"site-data.json").read_text(encoding="utf-8"))
          guide=json.loads((root/"care-guide.json").read_text(encoding="utf-8"))
          script=(root/"guide.js").read_text(encoding="utf-8")
          css=(root/"guide.css").read_text(encoding="utf-8")
          chinese=(root/"research_cn.js").read_text(encoding="utf-8")
          for section in ("where","hospitals","treatments","dictionary","research","faq"):
              assert 'id="'+section+'"' in patient, "Missing patient section: "+section
          assert "professional.html" not in patient
          assert 'id="hospital-list"' in patient
          assert 'id="comparison"' in patient
          assert 'id="term-list"' in patient
          assert 'id="stage-title"' in patient
          assert 'id="copy-questions"' in patient
          assert 'id="research-list"' in patient
          assert "hospitalMatch" in script and "comparisonRender" in script
          assert "glossaryRender" in script and "copyQuestions" in script
          assert "researchRender" in script
          assert "noopener noreferrer" in script and "innerHTML" not in script
          assert "prefers-reduced-motion" in css
          assert guide.get("schema_version")==2 and guide.get("review_status")=="editorial_reference_only_not_medically_reviewed"
          assert len(guide.get("hospitals",[]))>=12 and len(guide.get("journeys",[]))>=4
          assert sum(h["type"]=="军队医院" for h in guide["hospitals"])>=5
          assert sum(len(h["doctors"]) for h in guide["hospitals"])>=10
          assert all(h.get("appointment",{}).get("checked_at") and h.get("sources") for h in guide["hospitals"])
          assert len(guide.get("glossary",[]))>=12
          assert "describeArticle" in chinese and "describeTrial" in chinese
          assert len(guide.get("frontiers",[]))>=3
          assert data.get("schemaVersion")==1
          assert data.get("snapshotId") and data.get("collectedAt")
          assert len(data["articles"])>=1 and len(data["trials"])>=1
          assert "github.com" not in (root/"site-data.json").read_text(encoding="utf-8").lower()
          print("PUBLIC_HTTP_OK","snapshot="+data["snapshotId"],
                "articles="+str(len(data["articles"])),"trials="+str(len(data["trials"])),
                "hospital_profiles="+str(len(guide["hospitals"])),
                "care_stages="+str(len(guide["journeys"])),
                "military="+str(sum(h["type"]=="军队医院" for h in guide["hospitals"])),
                "doctor_profiles="+str(sum(len(h["doctors"]) for h in guide["hospitals"])))
          PY
