name: Finance indicator duplicate forensic audit

on:
  pull_request:
    paths:
      - 'ai_research/fina_indicator_conflict_forensics.py'
      - 'ai_research/tests/test_fina_indicator_conflict_forensics.py'
      - '.github/workflows/fina-indicator-conflict-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ai_research/fina_indicator_conflict_forensics.py'
      - '.github/workflows/fina-indicator-conflict-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone Clean schema dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=18,<25'
      - name: Test raw-field versus Clean-field conflict classification
        run: python -m unittest discover -s ai_research/tests -p test_fina_indicator_conflict_forensics.py -v

  live-forensics:
    needs: offline-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Tushare and Clean schema dependencies
        run: python -m pip install 'tushare>=1.4,<2' 'pandas>=2.2,<3' 'pyarrow>=18,<25'
      - name: Read original provider rows for four conflicts only
        run: |
          python -m ai_research.fina_indicator_conflict_forensics --output "$RUNNER_TEMP/fina_indicator_conflicts.json"
      - name: Configure temporary Google Drive remote
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::Drive Secret missing"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
          echo "RCLONE_CONFIG=$RCLONE_CONFIG" >> "$GITHUB_ENV"
          rclone listremotes | grep -qx 'gdrive:'
      - name: Immutable report publication and bytes verification
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/fina_indicator_conflicts.json"
          dest="gdrive:stock_state_strategy/finance_clean_five/conflict_audit/20261012/$GITHUB_RUN_ID.json"
          rclone copyto "$src" "$dest" --immutable
          test "$(sha256sum "$src" | awk '{print $1}')" = "$(rclone cat "$dest" | sha256sum | awk '{print $1}')"
          echo "FORENSICS_PUBLISHED run=$GITHUB_RUN_ID sha256=$(sha256sum "$src" | awk '{print $1}')"
