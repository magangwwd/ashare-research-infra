name: Pipeline CI

on:
  push:
    paths:
      - 'data_pipeline/**'
      - 'config/config.yaml'
      - 'tests/**'
      - '.github/workflows/pipeline-ci.yml'
  pull_request:
    paths:
      - 'data_pipeline/**'
      - 'config/config.yaml'
      - 'tests/**'
      - '.github/workflows/pipeline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
