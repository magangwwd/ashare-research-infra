name: Pipeline CI

on:
  push:
    paths:
      - 'data_pipeline/**'
      - 'config/config.yaml'
      - 'tests/**'
      - '.github/workflows/pipeline-ci.yml'
      - '.github/workflows/task01.yml'
      - '.github/workflows/task01-backfill.yml'
  pull_request:
    paths:
      - 'data_pipeline/**'
      - 'config/config.yaml'
      - 'tests/**'
      - '.github/workflows/pipeline-ci.yml'
      - '.github/workflows/task01.yml'
      - '.github/workflows/task01-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in (
              ".github/workflows/task01.yml",
              ".github/workflows/task01-backfill.yml",
              ".github/workflows/pipeline-ci.yml",
          ):
              yaml.safe_load(pathlib.Path(path).read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Run offline test suite
        run: python -m pytest -q
