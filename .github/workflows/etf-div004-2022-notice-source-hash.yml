name: ETF DIV-004 510300 2022 primary notice byte provenance
# Bounded source-byte audit only. No secrets, market prices, backtest or trading.
on:
  push:
    branches:
      - research/etf-div004-2022-notice-pdf-sha-20261025
    paths:
      - .github/workflows/etf-div004-2022-notice-source-hash.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-div004-2022-notice-byte-hash
  cancel-in-progress: false

jobs:
  official-pdf-byte-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch official SSE issuer notice bytes (bounded)
        env:
          SOURCE_URL: https://www.sse.com.cn/disclosure/fund/announcement/c/new/2022-01-12/510300_20220112_1_pWPNE0aG.pdf
        run: |
          curl --fail --location --silent --show-error \
            --retry 1 --retry-delay 2 \
            --connect-timeout 15 --max-time 75 --max-filesize 25000000 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/notice.pdf" \
            --write-out '%{url_effective}' "$SOURCE_URL" > "$RUNNER_TEMP/effective_url.txt"
      - name: Validate raw PDF and hash original bytes
        env:
          SOURCE_URL: https://www.sse.com.cn/disclosure/fund/announcement/c/new/2022-01-12/510300_20220112_1_pWPNE0aG.pdf
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          temp = Path(os.environ["RUNNER_TEMP"])
          raw = (temp / "notice.pdf").read_bytes()
          effective = (temp / "effective_url.txt").read_text().strip()
          parsed = urlparse(effective)
          if parsed.scheme != "https" or parsed.hostname != "www.sse.com.cn":
              raise SystemExit("FAIL_CLOSED: official PDF host changed")
          if not (128 <= len(raw) <= 25_000_000 and raw.startswith(b"%PDF-")):
              raise SystemExit("FAIL_CLOSED: response is not plausible PDF bytes")
          if b"%%EOF" not in raw[-2048:]:
              raise SystemExit("FAIL_CLOSED: missing PDF EOF marker")
          evidence = {
              "schema_version": 1,
              "task_id": "ETF-DIV-004",
              "symbol": "510300.SH",
              "event_ex_date": "2022-01-19",
              "status": "SOURCE_BYTES_HASHED_NOT_CONTENT_OR_MARKET_ACCEPTED",
              "trading_status": "NOT_FOR_TRADING",
              "source_url": os.environ["SOURCE_URL"],
              "effective_url": effective,
              "downloaded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "pdf_bytes": len(raw),
              "pdf_sha256": hashlib.sha256(raw).hexdigest(),
              "pdf_header_valid": True,
              "pdf_eof_marker_present": True,
              "notice_text_rechecked_in_this_run": False,
              "independent_market_prices_checked": False,
              "broker_cash_availability_checked": False,
              "drive_readback_performed": False,
              "limitations": [
                  "Byte hash proves retrieved PDF identity, not economic return accuracy.",
                  "Single issuer notice; other ETF dividends remain unverified.",
                  "No raw price/fund_adj reconciliation or cash settlement proof.",
                  "No ETF model, registry, data, orders, or strategy result changed."
              ]
          }
          Path("etf_div004_510300_2022_primary_notice_pdf_hash.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PRIMARY_2022_NOTICE_SHA256", evidence["pdf_sha256"])
          print("PRIMARY_2022_NOTICE_BYTES", evidence["pdf_bytes"])
          print("REVIEW_REQUIRED / NOT_FOR_TRADING")
          PY
      - name: Preserve hash manifest only (no PDF redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: etf-div004-510300-2022-primary-notice-hash
          path: etf_div004_510300_2022_primary_notice_pdf_hash.json
          if-no-files-found: error
          retention-days: 30
