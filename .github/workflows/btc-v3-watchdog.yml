name: BTC V3 progress watchdog

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btc-v3-watchdog.yml'
      - 'btc-quant/forward/health_check.py'

# Runs independently of the backtest. It never places trading orders.
permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: btc-v3-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify watchdog decision logic
        run: python -m unittest discover -s btc-quant/tests -p 'test_watchdog.py' -v
      - name: Check BTC V3 run, retry transient failures, report permanent stop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python btc-quant/ops/watchdog.py
      - name: Independently detect stalled, failed, or missing V3 forward daily paper runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python btc-quant/forward/health_check.py
