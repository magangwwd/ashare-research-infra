name: Overseas official data collector
run-name: Overseas data ${{ github.event_name }} - no LLM

on:
  push:
    branches: [main, feature/overseas-data-pilot-20261029, feature/overseas-data-expansion-20261029]
    paths:
      - 'overseas_research/**'
      - 'tests/test_overseas_research.py'
      - '.github/workflows/overseas-data-collector.yml'
  pull_request:
    paths:
      - 'overseas_research/**'
      - 'tests/test_overseas_research.py'
      - '.github/workflows/overseas-data-collector.yml'
  workflow_dispatch:
  # Beijing 06:30 primary and 07:15 catch-up. Schedules activate only on main.
  schedule:
    - cron: '30 22 * * *'
    - cron: '15 23 * * *'

permissions:
  contents: read

concurrency:
  group: overseas-official-data-drive
  cancel-in-progress: false

jobs:
  safety-and-parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Automatic source, chronology, failure and pointer protection tests
        run: python -m unittest discover -s tests -p test_overseas_research.py -v

  collect-and-publish:
    needs: safety-and-parser-tests
    # PR/feature branches run parser tests only; credentialed publication requires main.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Drive OAuth dependencies only
        run: python -m pip install 'google-auth>=2.38,<3' 'google-auth-oauthlib>=1.2,<2' 'PyYAML>=6,<7' 'requests>=2.32,<3'
      - name: Read and verify previous overseas snapshot for increment and revision tracking
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m overseas_research.drive --restore-previous "$RUNNER_TEMP/overseas_previous.json"
      - name: Download official sources, retain original bytes, and isolate gaps
        run: python -m overseas_research.collect --output "$RUNNER_TEMP/overseas_bundle" --previous "$RUNNER_TEMP/overseas_previous.json"
      - name: Upload changed originals, immutable snapshot and quality; verify bytes before switching isolated pointer
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m overseas_research.drive --input "$RUNNER_TEMP/overseas_bundle" --receipt "$RUNNER_TEMP/overseas_drive_receipt.json"
      - name: Retain safe run evidence even when a source or publication failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overseas-official-data-evidence
          path: |
            ${{ runner.temp }}/overseas_bundle/snapshot.json
            ${{ runner.temp }}/overseas_bundle/quality.json
            ${{ runner.temp }}/overseas_drive_receipt.json
          retention-days: 30
          if-no-files-found: warn
