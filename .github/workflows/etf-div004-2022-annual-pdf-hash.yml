name: ETF DIV-004 510300 2022 annual PDF source hash (research only)
# One bounded source-provenance check; no secrets, no price/strategy changes, no cron.
on:
  push:
    branches:
      - research/etf-div004-event-audit-20261021
    paths:
      - .github/workflows/etf-div004-2022-annual-pdf-hash.yml

permissions:
  contents: read

concurrency:
  group: etf-div004-510300-2022-annual-pdf-hash
  cancel-in-progress: false

jobs:
  source-byte-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch official SSE 510300 2022 audited annual report
        env:
          SOURCE_URL: https://www.sse.com.cn/disclosure/fund/announcement/c/new/2023-03-31/510300_20230331_TLSG.pdf
        run: |
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 90 --max-filesize 25000000 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/annual_report.pdf" \
            --write-out '%{url_effective}' "$SOURCE_URL" > "$RUNNER_TEMP/effective_url.txt"
      - name: Check PDF structure and write provenance manifest
        env:
          SOURCE_URL: https://www.sse.com.cn/disclosure/fund/announcement/c/new/2023-03-31/510300_20230331_TLSG.pdf
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          tmp = Path(os.environ["RUNNER_TEMP"])
          raw = (tmp / "annual_report.pdf").read_bytes()
          effective = (tmp / "effective_url.txt").read_text().strip()
          parsed = urlparse(effective)
          if parsed.scheme != "https" or parsed.hostname != "www.sse.com.cn":
              raise SystemExit("FAIL_CLOSED: source host changed")
          if not (128 <= len(raw) <= 25_000_000 and raw.startswith(b"%PDF-")):
              raise SystemExit("FAIL_CLOSED: not a plausible PDF")
          if b"%%EOF" not in raw[-2048:]:
              raise SystemExit("FAIL_CLOSED: PDF end marker missing")
          manifest = {
              "schema_version": 1,
              "task_id": "ETF-DIV-004",
              "symbol": "510300.SH",
              "report_year": 2022,
              "research_only": True,
              "status": "SOURCE_BYTES_HASHED_NOT_CONTENT_OR_MARKET_ACCEPTED",
              "trading_status": "NOT_FOR_TRADING",
              "source_url": os.environ["SOURCE_URL"],
              "effective_url": effective,
              "downloaded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_checkout_sha": os.environ["GITHUB_SHA"],
              "bytes": len(raw),
              "pdf_sha256": hashlib.sha256(raw).hexdigest(),
              "pdf_header_valid": True,
              "pdf_eof_marker_present": True,
              "content_text_extracted_in_this_run": False,
              "independent_market_price_checked": False,
              "account_cash_settlement_checked": False,
              "drive_readback_performed": False,
              "limitations": [
                  "Hash proves source bytes were retrieved, not economic total-return correctness.",
                  "2022 issuer annual report only; does not certify all dividend events or eight ETF coverage.",
                  "No independent raw_close/fund_adj, broker cash, Drive upload or full backtest.",
              ],
          }
          Path("etf_div004_510300_2022_annual_pdf_hash.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("OFFICIAL_2022_ANNUAL_PDF_SHA256", manifest["pdf_sha256"])
          print("OFFICIAL_2022_ANNUAL_PDF_BYTES", manifest["bytes"])
          print("REVIEW_REQUIRED / NOT_FOR_TRADING")
          PY
      - name: Preserve hash manifest as scoped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-div004-510300-2022-annual-pdf-hash
          path: etf_div004_510300_2022_annual_pdf_hash.json
          if-no-files-found: error
          retention-days: 30
