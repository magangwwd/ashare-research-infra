name: One-time R0 with historical exchange and ST risk constraints

on:
  push:
    branches:
      - research/pit-risk-guards-forward-v1-20261011
    paths:
      - '.github/workflows/research-gold-risk-compare-once.yml'

permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install minimum offline research packages
        run: python -m pip install 'pandas>=3.0,<4' 'numpy>=2.4,<3' 'pyarrow>=24.0,<25'
      - name: Test baseline temporal order plus fail-closed PIT filters
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_research_mainboard_daily_pit_v0.py test_research_risk_first_gate_scenarios.py test_gold_pit_risk_guards.py
      - name: Configure authorized Google Drive remote
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - name: Download Gold price/factor 2023-2026 and PIT execution constraints
        shell: bash
        run: |
          set -euo pipefail
          for dataset in daily_prices adjustment_factors; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/mainboard/$dataset" \
              --include 'year=2023/**' --include 'year=2024/**' --include 'year=2025/**' \
              --include 'year=2026/**' --transfers 8 --checkers 12 --retries 3
          done
          for dataset in daily_limits suspension_events; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/risks/$dataset" \
              --include 'year=2024/**' --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12 --retries 3
          done
          rclone copyto "gdrive:down_data/data/gold/main_board/name_history.parquet" "$RUNNER_TEMP/risks/name_history/data.parquet"
          test -s "$RUNNER_TEMP/mainboard/daily_prices/year=2026/month=10/data.parquet"
          test -s "$RUNNER_TEMP/risks/daily_limits/year=2026/month=10/data.parquet"
      - name: Re-evaluate dated hard-limit, suspension and ST barriers
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/research_compare_gold_pit_guards.py \
            --market-root "$RUNNER_TEMP/mainboard" \
            --risk-root "$RUNNER_TEMP/risks" \
            --out "$RUNNER_TEMP/pit_guard_compare_20261009"
      - name: Upload and verify audited paper-only results
        shell: bash
        run: |
          set -euo pipefail
          dest='gdrive:stock_state_strategy/output/pit_guard_compare_20261009'
          rclone copy "$RUNNER_TEMP/pit_guard_compare_20261009" "$dest" --transfers 6 --checkers 12
          rclone check "$RUNNER_TEMP/pit_guard_compare_20261009" "$dest" --one-way --checkers 12
          rclone cat "$dest/summary.json" | python -c 'import json,sys; x=json.load(sys.stdin); print(json.dumps({"base":{"net":x["base_r0"]["net_total_return"],"dd":x["base_r0"]["daily_nav_max_drawdown"]},"guarded":{"net":x["with_pit_guards"]["net_total_return"],"dd":x["with_pit_guards"]["daily_nav_max_drawdown"]}},indent=2))'
          echo "PAPER ONLY; no brokerage connection or order execution."
