name: Mainboard 3-5 day fixed-CNY swing PAPER

on:
  pull_request:
    paths:
      - 'astock-quant/stock_state_strategy/short_swing_3to5_v1.py'
      - 'astock-quant/stock_state_strategy/test_short_swing_3to5_v1.py'
      - 'astock-quant/stock_state_strategy/SHORT_SWING_3TO5_PAPER_V1.md'
      - '.github/workflows/short-swing-3to5-paper.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Historical start YYYY-MM-DD, no earlier than 2024-01-01'
        required: true
        default: '2024-01-01'
        type: string
      end:
        description: 'Last fully closed trade date YYYY-MM-DD'
        required: true
        type: string
      budget_cny:
        description: 'Fixed order size RMB 30000-50000'
        required: true
        default: '40000'
        type: string

permissions:
  contents: read

concurrency:
  group: mainboard-short-swing-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tests runtime
        run: python -m pip install 'pandas>=2.2,<4' 'pyarrow>=15'
      - name: Verify one-position and T+1 execution invariants
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_short_swing_3to5_v1.py

  gold-backtest:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      BUDGET: ${{ inputs.budget_cny }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Parquet runtime
        run: python -m pip install 'pandas>=2.2,<4' 'pyarrow>=15'
      - name: Set up temporary Drive credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo '::error::Missing Drive credentials'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" rclone listremotes | grep -qx 'gdrive:'
      - name: Validate range and retrieve dated Gold plus PIT records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date
          start=date.fromisoformat(os.environ['START'])
          end=date.fromisoformat(os.environ['END'])
          assert date(2024,1,1) <= start <= end, 'Invalid date range'
          assert 30000 <= float(os.environ['BUDGET']) <= 50000, 'Invalid order amount'
          PY
          base='gdrive:down_data/data/gold/main_board'
          mkdir -p "$RUNNER_TEMP/gold" "$RUNNER_TEMP/risk/name_history"
          rclone copyto "$base/manifest.json" "$RUNNER_TEMP/gold/manifest.json"
          from_year="$((10#${START:0:4}-1))"
          to_year="${END:0:4}"
          for year in $(seq "$from_year" "$to_year"); do
            for dataset in daily_prices adjustment_factors; do
              rclone copy "$base/$dataset/year=$year" "$RUNNER_TEMP/gold/$dataset/year=$year" --checkers 12 --transfers 8
            done
            for dataset in daily_limits suspension_events; do
              rclone copy "$base/$dataset/year=$year" "$RUNNER_TEMP/risk/$dataset/year=$year" --checkers 12 --transfers 8
            done
          done
          rclone copyto "$base/name_history.parquet" "$RUNNER_TEMP/risk/name_history/data.parquet"
      - name: Paper backtest on real historical prices
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/short_swing_3to5_v1.py \
            --market-root "$RUNNER_TEMP/gold" --risk-root "$RUNNER_TEMP/risk" \
            --start "$START" --end "$END" --cash-cny 50000 --budget-cny "$BUDGET" \
            --output "$RUNNER_TEMP/short-swing/result.json"
      - name: Publish immutable paper result with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          remote="gdrive:stock_state_strategy/output/short_swing_3to5_v1/$END/run_$GITHUB_RUN_ID"
          rclone copy "$RUNNER_TEMP/short-swing" "$remote" --immutable --checkers 4 --transfers 2
          rclone check "$RUNNER_TEMP/short-swing" "$remote" --one-way --checkers 4
          echo "PAPER_RESULT=$remote/result.json"
