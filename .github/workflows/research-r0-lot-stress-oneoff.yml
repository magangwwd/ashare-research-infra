name: One-time R0 PIT 100-share execution stress (research only)

on:
  push:
    branches: [research/r0-lot-size-execution-stress-20261011]
    paths:
      - '.github/workflows/research-r0-lot-stress-oneoff.yml'
      - 'astock-quant/stock_state_strategy/research_mainboard_daily_pit_v0.py'
      - 'astock-quant/stock_state_strategy/research_r0_execution_stress_v1.py'
      - 'astock-quant/stock_state_strategy/test_research_execution_lots_v1.py'

permissions:
  contents: read

concurrency:
  group: oneoff-r0-execution-stress-drive
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install minimal analysis dependencies
        run: python -m pip install 'pandas>=3.0,<4' 'numpy>=2.4,<3' 'pyarrow>=24.0,<25'
      - name: Run execution and PIT offline invariants before touching Drive
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_research_mainboard_daily_pit_v0.py test_gold_pit_risk_guards.py test_research_risk_first_gate_scenarios.py test_research_execution_lots_v1.py
      - name: Configure read-only source download and result-only upload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - name: Download exact historical Gold price/factor and dated PIT risk
        shell: bash
        run: |
          set -euo pipefail
          for dataset in daily_prices adjustment_factors; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/market/$dataset" \
              --include 'year=2023/**' --include 'year=2024/**' --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12
          done
          for dataset in daily_limits suspension_events; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/risk/$dataset" \
              --include 'year=2024/**' --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12
          done
          rclone copyto "gdrive:down_data/data/gold/main_board/name_history.parquet" "$RUNNER_TEMP/risk/name_history/data.parquet"
      - name: Four independent R0 PIT simulations, never trading
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/research_r0_execution_stress_v1.py \
            --market-root "$RUNNER_TEMP/market" \
            --risk-root "$RUNNER_TEMP/risk" \
            --out "$RUNNER_TEMP/lot_execution_stress"
      - name: Upload new independent historical outputs, verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          target="gdrive:stock_state_strategy/output/r0_lot_execution_stress_20261009"
          rclone copy "$RUNNER_TEMP/lot_execution_stress" "$target" --immutable --transfers 4 --checkers 8
          rclone check "$RUNNER_TEMP/lot_execution_stress" "$target" --one-way --checkers 8
          echo "PAPER_ONLY_NO_ENTRY_AUTHORIZATION: no fresh signal, no order, no new rules"
