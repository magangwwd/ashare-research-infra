name: Mainboard dual-Drive read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and rclone
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Prepare ephemeral rclone config
        shell: bash
        env:
          GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$GDRIVE_RCLONE_CONFIG_B64" ]; then
            (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
            echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          fi
      - name: Read-only remote marker inspection
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m tools.mainboard_remote_probe --output metadata/mainboard_remote_probe.json
      - name: Archive sanitized diagnostic even when markers fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainboard-remote-probe
          path: metadata/mainboard_remote_probe.json
          retention-days: 14
          if-no-files-found: warn
