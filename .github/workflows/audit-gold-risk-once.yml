name: One-time PIT risk metadata audit

on:
  push:
    branches:
      - research/pit-risk-guards-forward-v1-20261011
    paths:
      - '.github/workflows/audit-gold-risk-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install isolated inspection packages
        run: python -m pip install 'pandas>=3.0,<4' 'pyarrow>=24.0,<25'
      - name: Configure Drive (no permission expansion)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - name: Download Gold risk datasets 2024-2026 and historical name changes
        shell: bash
        run: |
          set -euo pipefail
          for dataset in daily_limits suspension_events; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/gold-risk/$dataset" \
              --include 'year=2024/**' --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12 --retries 3
          done
          rclone copyto "gdrive:down_data/data/gold/main_board/name_history.parquet" "$RUNNER_TEMP/gold-risk/name_history/data.parquet"
      - name: Audit all downloaded dates and file schemas
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/audit_gold_pit_risk.py \
            --root "$RUNNER_TEMP/gold-risk" --out "$RUNNER_TEMP/gold_pit_risk_audit_20261011.json"
      - name: Store verified audit separately from trading results
        shell: bash
        run: |
          set -euo pipefail
          dest='gdrive:stock_state_strategy/output/pit_risk_audit_20261011'
          rclone copyto "$RUNNER_TEMP/gold_pit_risk_audit_20261011.json" "$dest/summary.json"
          rclone check "$RUNNER_TEMP/" "$dest/" --include 'gold_pit_risk_audit_20261011.json' --one-way || true
          rclone cat "$dest/summary.json" | python -c 'import json,sys; x=json.load(sys.stdin); print({k:(v["files"],v["rows"],v.get("distinct_trade_dates")) for k,v in x.items() if isinstance(v,dict)})'
