name: ETF research one-shot checkpoint pipeline

# A single project run, NOT an hourly repeating backtest. Stage succession is
# controlled by research_pipeline.py. Only workflow installation/update on main
# triggers the initial run; future research cycles require explicit dispatch.
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Previous ETF pipeline run ID to resume from its verified artifact (leave blank for new)"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - .github/workflows/etf-research-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: etf-research-one-shot
  cancel-in-progress: false

jobs:
  research:
    name: ETF predefined stages with persistent checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TUSHARE_TOKEN: \${{ secrets.TUSHARE_TOKEN }}
      GDRIVE_OAUTH_JSON: \${{ secrets.GDRIVE_OAUTH_JSON }}
      ETF_RESUME_RUN_ID: \${{ inputs.resume_run_id }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout frozen ETF research branch
        uses: actions/checkout@v4
        with:
          ref: feature/etf-single-rotation-v1
          persist-credentials: false

      - name: Python with cached packages
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install required packages
        run: python -m pip install -r requirements.txt

      - name: Restore prior run artifact only when explicitly resuming
        if: \${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: etf-research-checkpoint
          run-id: \${{ inputs.resume_run_id }}
          github-token: \${{ github.token }}
          path: .

      - name: Run ordered research stages, fail closed, save each checkpoint
        run: python -m etf_single_rotation.research_pipeline

      - name: Preserve full outputs and the last checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-research-checkpoint
          path: |
            etf_single_rotation/state/run_checkpoint.json
            etf_single_rotation/data/prices.csv
            etf_single_rotation/data/trade_calendar.csv
            etf_single_rotation/results/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
