name: One-off all-main-board daily PIT entry diagnostic (paper)

on:
  push:
    branches:
      - research/mainboard-pit-daily-entry-v0-20261011
    paths:
      - '.github/workflows/research-mainboard-pit-backtest-once.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install 'numpy>=2.4,<3' 'pandas>=3.0,<4' 'pyarrow>=24.0,<25'
      - name: Test causality and A-share T+1 invariants
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_research_mainboard_daily_pit_v0.py
      - name: Configure isolated Google Drive credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::Missing Drive secret"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          rclone --config "$RUNNER_TEMP/rclone.conf" listremotes | grep -qx 'gdrive:'
      - name: Read all historical main-board price/factor partitions 2023-2026
        shell: bash
        run: |
          set -euo pipefail
          for setname in daily_prices adjustment_factors; do
            rclone copy "gdrive:down_data/data/gold/main_board/$setname" "$RUNNER_TEMP/mainboard/$setname" \
              --include 'year=2023/**' --include 'year=2024/**' \
              --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12 --retries 3
            test -s "$RUNNER_TEMP/mainboard/$setname/year=2026/month=10/data.parquet"
          done
      - name: Run all-market daily point-in-time technical signal and portfolio study
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/research_mainboard_daily_pit_v0.py \
            --root "$RUNNER_TEMP/mainboard" \
            --output "$RUNNER_TEMP/research_mainboard_daily_pit_v0_20261009"
      - name: Save and verify independent diagnostic outputs on Drive
        shell: bash
        run: |
          set -euo pipefail
          target='gdrive:stock_state_strategy/output/research_mainboard_daily_pit_v0_20261009'
          rclone copy "$RUNNER_TEMP/research_mainboard_daily_pit_v0_20261009" "$target" --transfers 6 --checkers 12
          rclone check "$RUNNER_TEMP/research_mainboard_daily_pit_v0_20261009" "$target" --one-way --checkers 12
          rclone cat "$target/summary.json" | python -c 'import json,sys; s=json.load(sys.stdin);print(json.dumps({"status":s["status"],"overall":s["overall"],"scope":s["scope"]},ensure_ascii=False,indent=2))'
          echo 'PAPER ONLY: no brokerage connections, no strategy rewrite.'

