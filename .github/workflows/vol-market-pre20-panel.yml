name: Frozen vol expansion market state + independent pre20 expanded A-share panel (NO TRADES)

on:
  pull_request:
    paths:
      - 'ai_research/vol_market_pre20_panel.py'
      - 'ai_research/tests/test_vol_market_pre20_panel.py'
      - '.github/workflows/vol-market-pre20-panel.yml'
  push:
    branches: [main]
    paths:
      - 'ai_research/vol_market_pre20_panel.py'
      - '.github/workflows/vol-market-pre20-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-vol-market-pre20-expanded-panel
  cancel-in-progress: false

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<25'
      - name: Reject market time leaks and preserve original partitions
        run: python -m unittest -v ai_research.tests.test_vol_market_pre20_panel

  real-expanded-study:
    needs: offline-qa
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Prepare actual Drive-backed historical dataset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<25'
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" rclone listremotes | grep -qx 'gdrive:'
      - name: Lock archive reference and signed historical Gold metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/panel/gold"
          orig='gdrive:stock_state_strategy/output/five_stock_volatility_pre20_deep_v1/2026-10-16/run_39175478966'
          rclone copyto "$orig/statistics.json" "$RUNNER_TEMP/panel/reference_statistics.json"
          rclone copyto "$orig/manifest.json" "$RUNNER_TEMP/panel/reference_manifest.json"
          gold='gdrive:down_data/data/gold/main_board'
          rclone copyto "$gold/manifest.json" "$RUNNER_TEMP/panel/gold_manifest.json"
          rclone copyto "$gold/trading_calendar.parquet" "$RUNNER_TEMP/panel/gold/trading_calendar.parquet"
          python - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"panel"
          orig=(root/"reference_statistics.json").read_bytes()
          evidence=json.loads((root/"reference_manifest.json").read_text())
          gold=json.loads((root/"gold_manifest.json").read_text())
          assert evidence["files_sha256"]["statistics.json"]==hashlib.sha256(orig).hexdigest()
          assert gold["as_of_date"]>="2026-10-16"
          assert gold["validation"]["primary_keys_unique"] and gold["validation"]["ohlc_valid"]
          assert json.loads(orig)["coverage"]["expansion_events"]==133
          assert json.loads(orig)["coverage"]["focus_5_to_10_events"]==17
          print("Old archived 133 events verified; main-board Gold valid")
          PY
      - name: Read all main-board Gold price and factor partitions for reproducible panel
        shell: bash
        run: |
          set -euo pipefail
          gold='gdrive:down_data/data/gold/main_board'
          for dataset in daily_prices adjustment_factors; do
            rclone copy "$gold/$dataset" "$RUNNER_TEMP/panel/gold/$dataset" \
              --include 'year=202[3456]/month=*/data.parquet' --checkers 4 --transfers 6
            n="$(find "$RUNNER_TEMP/panel/gold/$dataset" -name data.parquet | wc -l)"
            test "$n" -ge 45
            echo "$dataset downloaded=$n"
          done
      - name: Compute frozen panel and real OHLC risks with prior-market close confirmation
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_research.vol_market_pre20_panel \
            --gold-root "$RUNNER_TEMP/panel/gold" \
            --gold-manifest "$RUNNER_TEMP/panel/gold_manifest.json" \
            --prior-five "$RUNNER_TEMP/panel/reference_statistics.json" \
            --out "$RUNNER_TEMP/panel/report"
          python - <<'PY'
          import json,pathlib,os
          f=pathlib.Path(os.environ["RUNNER_TEMP"])/"panel/report/statistics.json"
          x=json.loads(f.read_text())
          assert x["version"]=="VOL_MARKET_DAY_PRE20_PANEL_V1"
          assert x["as_of"]=="2026-10-16"
          assert x["authorization"]=="RESEARCH_ONLY_NO_TRADING"
          assert x["universe"]["selected_symbols"]==245
          assert x["reference_five_verification"]["original_focus_5to10_reproduced"]==17
          assert x["expanded_panel"]["all"]["all_vol_expansion"]["n"]>133
          print("Expanded stock/market/independent 20-day eligibility",x["expanded_panel"]["all"]["correct_pre20_5to10"]["n"])
          PY
      - name: Immutable archive and independent rclone file checksum validation
        shell: bash
        run: |
          set -euo pipefail
          dst="gdrive:stock_state_strategy/output/vol_market_pre20_expanded_panel_v1/2026-10-16/run_$GITHUB_RUN_ID"
          rclone copy "$RUNNER_TEMP/panel/report" "$dst" --immutable --transfers 4
          rclone check "$RUNNER_TEMP/panel/report" "$dst" --one-way
          echo "VOL_MARKET_PRE20_245_TICKERS_VERIFIED_NO_TRADES"
