name: astock-quant - rank A-pool watchlist (Drive only)

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Verified source trading day YYYY-MM-DD"
        required: true
        default: '2026-10-09'
        type: string
      top:
        description: "Number of watchlist rows"
        required: true
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  rank-a-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: astock-a-watchlist-${{ inputs.as_of }}
      cancel-in-progress: false
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      AS_OF: ${{ inputs.as_of }}
      TOP_COUNT: ${{ inputs.top }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate input date and bounds
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Invalid YYYY-MM-DD"; exit 1; }
          [[ "$TOP_COUNT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::Invalid top count"; exit 1; }
          (( TOP_COUNT >= 1 && TOP_COUNT <= 100 )) || { echo "::error::Top count must be 1..100"; exit 1; }
          echo "DAYKEY=$(printf '%s' "$AS_OF" | tr -d '-')" >> "$GITHUB_ENV"
      - name: Run ranking offline tests
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_rank_a_watchlist.py
      - name: Restore Drive remote
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::Missing Drive Secret"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          rclone --config "$RUNNER_TEMP/rclone.conf" listremotes | grep -qx 'gdrive:'
      - name: Read verified source A-pool from Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto "gdrive:stock_state_strategy/output/state_definition_$DAYKEY/a_strategy_pool.csv" "$RUNNER_TEMP/a_strategy_pool.csv"
          test -s "$RUNNER_TEMP/a_strategy_pool.csv"
      - name: Rank original A-pool without altering stock classifications
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/rank_a_watchlist.py \
            --input "$RUNNER_TEMP/a_strategy_pool.csv" \
            --output-dir "$RUNNER_TEMP/research_watchlist_$DAYKEY" \
            --as-of "$AS_OF" --top "$TOP_COUNT"
      - name: Publish four outputs to Drive and verify
        shell: bash
        run: |
          set -euo pipefail
          target="gdrive:stock_state_strategy/output/research_watchlist_$DAYKEY"
          rclone copy "$RUNNER_TEMP/research_watchlist_$DAYKEY" "$target" --transfers 4 --checkers 8
          rclone check "$RUNNER_TEMP/research_watchlist_$DAYKEY" "$target" --one-way --checkers 8
          rclone cat "$target/ranking_summary.json"
          echo "Research only: no entry permission or Git data commits."
