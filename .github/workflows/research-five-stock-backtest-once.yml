name: One-time five-stock technical entry backtest (paper only)

on:
  push:
    branches:
      - research/five-stock-entry-diagnostic-20261011
    paths:
      - '.github/workflows/research-five-stock-backtest-once.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install read-only backtest dependencies
        run: python -m pip install 'numpy>=2.4,<3' 'pandas>=3.0,<4' 'pyarrow>=24.0,<25'
      - name: Configure authorized read/write project Drive remote
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::Missing Drive secret"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/rclone.conf")
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          rclone --config "$RUNNER_TEMP/rclone.conf" listremotes | grep -qx 'gdrive:'
      - name: Download historical 2023-2026 daily bars and adjusted factors
        shell: bash
        run: |
          set -euo pipefail
          for dataset in daily_prices adjustment_factors; do
            rclone copy "gdrive:down_data/data/gold/main_board/$dataset" "$RUNNER_TEMP/entry_bars/$dataset" \
              --include 'year=2023/**' --include 'year=2024/**' \
              --include 'year=2025/**' --include 'year=2026/**' \
              --transfers 8 --checkers 12 --retries 3
            test -s "$RUNNER_TEMP/entry_bars/$dataset/year=2026/month=10/data.parquet" || \
              { echo "::error::Missing October 2026 $dataset"; exit 1; }
          done
      - name: Run historical diagnostic with T+1 entry and costs
        shell: bash
        run: |
          set -euo pipefail
          python astock-quant/stock_state_strategy/research_five_stock_entry_backtest.py \
            --root "$RUNNER_TEMP/entry_bars" \
            --output "$RUNNER_TEMP/five_stock_entry_diagnostic_20261009"
      - name: Publish independent research output on Google Drive and verify
        shell: bash
        run: |
          set -euo pipefail
          folder="gdrive:stock_state_strategy/output/five_stock_entry_diagnostic_20261009"
          rclone copy "$RUNNER_TEMP/five_stock_entry_diagnostic_20261009" "$folder" --transfers 4 --checkers 8
          rclone check "$RUNNER_TEMP/five_stock_entry_diagnostic_20261009" "$folder" --one-way --checkers 8
          rclone cat "$folder/summary.json" | python -c 'import json,sys; s=json.load(sys.stdin); print(json.dumps(s["overall"],ensure_ascii=False,indent=2))'
          echo "PAPER_ONLY: historical diagnostic; no trading and no changes to frozen strategy."
