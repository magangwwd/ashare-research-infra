name: Drive credential scope probe (manual only)

on:
  workflow_dispatch:
    inputs:
      write_probe:
        description: 'Write and delete unique disposable files in verified probe folders'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      WRITE_PROBE: ${{ inputs.write_probe }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          python -m pip install google-auth requests
      - name: Run redacted credential scope checks
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.drive_credential_probe --output "$RUNNER_TEMP/drive_scope_report.json"
      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-credential-scope-report
          path: ${{ runner.temp }}/drive_scope_report.json
          retention-days: 30
          if-no-files-found: warn
