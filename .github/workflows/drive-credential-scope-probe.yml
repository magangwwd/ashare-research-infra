name: Drive credential scope probe (manual only)

on:
  workflow_dispatch:
    inputs:
      write_probe:
        description: 'Write and delete unique disposable files in verified probe folders'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      WRITE_PROBE: ${{ inputs.write_probe }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          python -m pip install -r requirements.txt
      - name: Run redacted credential scope checks
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.drive_credential_probe --output "$RUNNER_TEMP/drive_scope_report.json"
      - name: Independently verify Task 01 OAuth target folder
        shell: bash
        run: |
          set +e
          python -m data_pipeline.drive_auth verify --report "$RUNNER_TEMP/task01_oauth_auth_report.json" > "$RUNNER_TEMP/oauth-probe.log" 2>&1
          code=$?
          echo "Task 01 OAuth verification exit_code=$code"
          if [[ -f "$RUNNER_TEMP/task01_oauth_auth_report.json" ]]; then
            echo "Task 01 OAuth evidence file created"
          else
            echo "::warning::No OAuth evidence file; do not infer authorization"
          fi
          exit 0
      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-credential-scope-report
          path: |
            ${{ runner.temp }}/drive_scope_report.json
            ${{ runner.temp }}/task01_oauth_auth_report.json
          retention-days: 30
          if-no-files-found: warn
