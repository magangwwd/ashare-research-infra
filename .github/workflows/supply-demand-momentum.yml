name: Supply demand momentum - Drive paper tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supply_demand_momentum/**'
      - '.github/workflows/supply-demand-momentum.yml'
  pull_request:
    paths:
      - 'supply_demand_momentum/**'
      - '.github/workflows/supply-demand-momentum.yml'
  schedule:
    # Beijing 06:47; existing Gold updater starts at 23:50.
    - cron: '47 22 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r supply_demand_momentum/requirements.txt
      - run: python -m unittest discover -s supply_demand_momentum/tests -v
  daily:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same group as Gold writer: never copy while that writer is active.
    concurrency:
      group: stock-strategy-drive-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r supply_demand_momentum/requirements.txt
      - name: Configure existing Drive identity
        env:
          GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          sdm_config="$RUNNER_TEMP/sdm-rclone.conf"
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$sdm_config")
          echo "RCLONE_CONFIG=$sdm_config" >> "$GITHUB_ENV"
          rclone --config "$sdm_config" listremotes | grep -qx 'gdrive:'
      - name: Compute and verify private Drive outputs
        run: python -m supply_demand_momentum.run
      - name: Remove temporary credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sdm-rclone.conf"
