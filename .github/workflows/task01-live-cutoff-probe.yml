name: Temporary Task 01 live cutoff smoke verification
on:
  push:
    paths:
      - '.github/workflows/task01-live-cutoff-probe.yml'
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Isolated live Tushare smoke (no Drive write)
        shell: bash
        run: |
          set -euo pipefail
          python -m data_pipeline.run_task01 --mode smoke --root "$RUNNER_TEMP/task01-live-cutoff"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "task01-live-cutoff"
          doc = json.loads((root / "metadata/capabilities/latest.json").read_text())
          print("VERIFIED_LIVE_PROBE_TRADE_DATE=" + doc["probe_trade_date"])
          for name in ("daily", "adj_factor", "daily_basic"):
              assert doc["interfaces"][name]["status"] == "AVAILABLE", (name, doc["interfaces"][name])
              print("VERIFIED_LIVE_ENDPOINT_OK=" + name)
          PY
