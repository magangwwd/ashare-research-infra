name: BTC OKX archive freshness watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify recent successful archive run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/workflows/btc-okx-market-archive.yml/runs?per_page=20"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=25) as r: runs=json.load(r)["workflow_runs"]
          now=dt.datetime.now(dt.timezone.utc)
          good=[x for x in runs if x.get("conclusion")=="success"]
          if not good: raise SystemExit("ALERT: no successful OKX archive workflow run")
          latest=max(dt.datetime.fromisoformat(x["created_at"].replace("Z","+00:00")) for x in good)
          age=(now-latest).total_seconds()/3600
          print(f"Latest successful archive run age: {age:.2f}h")
          if age>6: raise SystemExit(f"ALERT: archive freshness exceeded 6 hours: {age:.2f}")
          PY
