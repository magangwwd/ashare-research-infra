name: gdrive - auth health check (read-only)

# Weekly read-only probe. Keeps the OAuth refresh token / client "in use"
# (Google may expire tokens unused for ~6 months and flag clients idle for 6 months).
# A failure here = re-authorize locally and re-run setup_gdrive_rclone.ps1 step 5.
on:
  schedule:
    - cron: "17 1 * * 1"   # Mondays 01:17 UTC (09:17 Beijing)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_RCLONE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
    steps:
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Read-only Drive probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GDRIVE_RCLONE_CONFIG_B64" || { echo "::error::secret GDRIVE_RCLONE_CONFIG_B64 missing"; exit 1; }
          cfg="$RUNNER_TEMP/rclone.conf"
          (umask 077; printf '%s' "$GDRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$cfg")
          # Token refresh happens here; failure => invalid_grant / revoked / expired
          if ! rclone --config "$cfg" lsf gdrive: --dirs-only > "$RUNNER_TEMP/dirs.txt"; then
            echo "::error::Google Drive OAuth refresh/list FAILED - re-authorize rclone and update GDRIVE_RCLONE_CONFIG_B64"
            exit 1
          fi
          for d in down_data/ stock_state_strategy/; do
            grep -qx "$d" "$RUNNER_TEMP/dirs.txt" || { echo "::error::expected folder $d not found under gdrive root"; exit 1; }
          done
          echo "OK: token refreshed, project folders visible"
          rm -f "$cfg"
