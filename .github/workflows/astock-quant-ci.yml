name: astock-quant - offline CI

on:
  pull_request:
    paths:
      - 'astock-quant/**'
      - '.github/workflows/astock-quant-*.yml'
  push:
    branches: [main]
    paths:
      - 'astock-quant/**'
      - '.github/workflows/astock-quant-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Reject tracked generated data and private runtime files
        working-directory: astock-quant
        run: python stock_state_strategy/check_git_storage_policy.py
      - name: Compile imported strategy Python code
        working-directory: astock-quant
        run: python -m compileall -q stock_state_strategy
      - name: Run imported offline tests
        working-directory: astock-quant/stock_state_strategy
        run: python -m unittest -v test_data_source_paths.py test_github_drive_runner.py test_drive_only_contract.py

  full-strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install frozen-strategy test dependencies
        run: python -m pip install --require-hashes -r astock-quant/stock_state_strategy/requirements.txt
      - name: Test all strategy modules without Drive or trading credentials
        working-directory: astock-quant/stock_state_strategy
        run: python run_pipeline.py tests
