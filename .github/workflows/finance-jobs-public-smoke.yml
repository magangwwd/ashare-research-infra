name: Finance Jobs Public Site Smoke
on:
  workflow_run:
    workflows: ['Finance Jobs Website Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  verify-public:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public website and both cloud-derived data files
        shell: bash
        run: |
          set -euo pipefail
          base="https://magangwwd.github.io/ashare-research-infra"
          mkdir -p "$RUNNER_TEMP/finance_site_test"
          for f in index.html app.js styles.css data/latest.json data/monitor.json data/changes.json data/qq_feed.json; do
            mkdir -p "$RUNNER_TEMP/finance_site_test/$(dirname "$f")"
            curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 \
              "$base/$f" -o "$RUNNER_TEMP/finance_site_test/$f"
          done
      - name: Verify finance content, SGCC link, dated sourcing and absence of prior medical site
        env:
          ROOT: ${{ runner.temp }}/finance_site_test
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["ROOT"])
          page=(p/"index.html").read_text("utf-8")
          js=(p/"app.js").read_text("utf-8")
          css=(p/"styles.css").read_text("utf-8")
          d=json.loads((p/"data/latest.json").read_text("utf-8"))
          m=json.loads((p/"data/monitor.json").read_text("utf-8"))
          changes=json.loads((p/"data/changes.json").read_text("utf-8"))
          qq=json.loads((p/"data/qq_feed.json").read_text("utf-8"))
          for x in ("urgent","jobs","focus","guide","changes","qq-focus"):
              assert 'id="'+x+'"' in page,x
          for id in ("filter-region","filter-qs","filter-overseas","urgent-list","jobs-list",
                     "category-count-core","changes-list","hero-search","hero-search-go",
                     "hero-region","filter-sort","job-detail-pane","job-detail","close-detail","detail-backdrop"):
              assert 'id="'+id+'"' in page,id
          assert "zhaopin.sgcc.com.cn/sgcchr/static/unitPart.html?bullet_id=dcefb56d04714dc4b488d0a7a204bf76" in page
          assert "乳腺疾病" not in page and "乳腺癌" not in page
          assert "daysBetween" in js and "near-deadline" in js
          assert "prefers-reduced-motion" in css
          assert d.get("schema")==1 and len(d.get("listings",[]))>=50
          assert d.get("collected_at") and d.get("data_as_of")
          assert m.get("schema")==1 and isinstance(m.get("sources"),list)
          assert len(d.get("sources",[]))>=25
          assert changes.get("previous_collected_at") and isinstance(changes.get("events"),list)
          assert qq.get("schema")==1 and qq.get("source_url")=="https://docs.qq.com/sheet/DS210WHFxVXdHcWJS?tab=BB08J2"
          assert isinstance(qq.get("leads"),list) and all(not item.get("role_confirmed") for item in qq["leads"])
          assert "private_export_folder_id" not in qq and "resume" not in str(qq).lower()
          assert 'id="qq-feed-status"' in page and 'id="qq-shortlist"' in page
          assert "docs.qq.com/sheet/DS210WHFxVXdHcWJS" in page
          assert "categoryOf" in js and "renderChanges" in js
          assert "selectJob" in js and "closeMobileDetail" in js and "sortJobs" in js
          assert 'id="back-to-top"' in page and 'href="#home"' in page
          assert "jobs-more" not in page and "jobs-more" not in js
          assert "arr.forEach(job=>target.append(jobCard(job)))" in js
          assert "已全部展示" in js and ".list-end #back-to-top" in css
          assert "jobs-workspace" in css and "job-detail-pane" in css
          assert "--bg:#f8f8f6" in css and "--blue:#28596f" in css
          assert "aside-steps" in page and "寻找匹配的岗位" in page
          assert 'content="#f8f8f6"' in page
          assert "@media(max-width:620px)" in css and "prefers-reduced-motion" in css
          assert all(x.get("checked_at") and x.get("source_url") and x.get("posting_level") for x in d["listings"])
          print("FINANCE_PUBLIC_HTTP_OK listings="+str(len(d["listings"]))+" sources="+str(len(m["sources"]))+
                " collected="+d["collected_at"]+" data_as_of="+d["data_as_of"]+
                " events="+str(changes["total_events"]))
          PY
