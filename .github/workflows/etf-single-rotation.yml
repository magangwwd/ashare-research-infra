name: ETF single rotation research
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate signals only when real input data exists
        run: |
          if [ ! -f data/prices.csv ]; then
            echo 'Real price data missing. No signals or backtest generated.'
            exit 1
          fi
          python etf_single_rotation/backtest.py data/prices.csv
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: etf-monthly-signals
          path: etf_single_rotation/results/signals.csv
