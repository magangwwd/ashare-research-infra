name: Task 01 historical backfill

on:
  push:
    paths:
      - '.github/backfill-now'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: task01-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Restore latest shared Task 01 checkpoint
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=task01-checkpoint" > /tmp/task01-artifacts.json
          artifact_id=$(python - <<'PY'
          import json
          artifacts = json.load(open('/tmp/task01-artifacts.json'))['artifacts']
          available = sorted((a for a in artifacts if not a['expired']), key=lambda a: a['created_at'], reverse=True)
          print(available[0]['id'] if available else '')
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "checkpoint_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf /tmp/task01-checkpoint-restore
          mkdir -p /tmp/task01-checkpoint-restore
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/task01-checkpoint.zip
          unzip -p /tmp/task01-checkpoint.zip task01-state.tar.gz > /tmp/task01-state.tar.gz
          tar -xzf /tmp/task01-state.tar.gz -C /tmp/task01-checkpoint-restore
          rm -rf data metadata
          [ ! -d /tmp/task01-checkpoint-restore/data ] || cp -a /tmp/task01-checkpoint-restore/data .
          [ ! -d /tmp/task01-checkpoint-restore/metadata ] || cp -a /tmp/task01-checkpoint-restore/metadata .
          echo "checkpoint_found=true" >> "$GITHUB_OUTPUT"

      - name: Restore Drive production if no checkpoint
        if: steps.restore.outputs.checkpoint_found != 'true'
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m data_pipeline.drive_restore

      - name: Check whether historical acceleration is still needed
        id: backfill_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          progress_path = Path("metadata/history_progress.json")
          history_path = Path("metadata/manifest/history.json")
          market_complete = False
          generic_complete = False
          if progress_path.exists():
              progress = json.loads(progress_path.read_text(encoding="utf-8"))
              market_complete = bool(progress.get("market_history_complete"))
          if history_path.exists():
              history = json.loads(history_path.read_text(encoding="utf-8"))
              generic_complete = bool(history.get("all_enabled_requests_examined"))
          needed = not (market_complete and generic_complete)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"needed={'true' if needed else 'false'}\n")
          print({
              "backfill_needed": needed,
              "market_history_complete": market_complete,
              "all_enabled_requests_examined": generic_complete,
          })
          PY

      - name: Live Tushare smoke gate
        if: steps.backfill_guard.outputs.needed == 'true'
        run: python -m data_pipeline.run_task01 --mode smoke

      - name: Accelerated historical backfill
        if: steps.backfill_guard.outputs.needed == 'true'
        run: python -m data_pipeline.run_task01 --mode backfill

      - name: Production acceptance
        if: steps.backfill_guard.outputs.needed == 'true'
        shell: bash
        run: |
          BACKFILL_AS_OF=$(TZ=Asia/Shanghai date -d 'yesterday' +%F)
          python -m data_pipeline.validate --as-of "$BACKFILL_AS_OF"

      - name: Package shared recovery state
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d metadata ]; then
            if [ -d data ]; then
              tar -czf task01-state.tar.gz data metadata
            else
              tar -czf task01-state.tar.gz metadata
            fi
          fi

      - name: Save shared Task 01 checkpoint
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task01-checkpoint
          path: task01-state.tar.gz
          retention-days: 90
          if-no-files-found: ignore
          compression-level: 0

      - name: Publish backfill progress
        if: success() && steps.backfill_guard.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task01-backfill-progress
          path: |
            metadata/history_progress.json
            metadata/history_progress.md
            metadata/manifest/history.json
            metadata/manifest/intraday.json
            metadata/manifest/gaps.json
            metadata/acceptance.json
          retention-days: 30
          if-no-files-found: error
