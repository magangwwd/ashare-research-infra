name: Task 01 data infrastructure

on:
  schedule:
    # 12:00 UTC = 20:00 Asia/Shanghai; GitHub may delay scheduled starts.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      verify_drive_auth:
        description: 'Only verify Drive OAuth; no downloads or Drive uploads'
        type: boolean
        default: false
      publish_drive_snapshot:
        description: 'Upload latest accepted checkpoint to Drive; no new Tushare downloads'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: task01-data
  cancel-in-progress: false

jobs:
  drive-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_drive_auth && !inputs.publish_drive_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive authorization dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify offline OAuth and target folder access
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m data_pipeline.drive_auth verify --report metadata/drive_auth.json
      - name: Publish safe authorization and capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: task01-drive-auth-report
          path: metadata/drive_auth.json
          retention-days: 30
          if-no-files-found: error
  task01:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_drive_auth && !inputs.publish_drive_snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Restore the latest resumable checkpoint
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=task01-checkpoint" > /tmp/task01-artifacts.json
          artifact_id=$(python - <<'PY'
          import json
          artifacts = json.load(open('/tmp/task01-artifacts.json'))['artifacts']
          available = [a for a in artifacts if not a['expired']]
          available.sort(key=lambda a: a['created_at'], reverse=True)
          print(available[0]['id'] if available else '')
          PY
          )
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/task01-checkpoint.zip
            unzip -p /tmp/task01-checkpoint.zip task01-state.tar.gz > /tmp/task01-state.tar.gz
            tar -xzf /tmp/task01-state.tar.gz
          fi
      - name: Live Tushare smoke gate
        run: python -m data_pipeline.run_task01 --mode smoke
      - name: Daily update or maintenance
        run: python -m data_pipeline.run_task01 --mode auto
      - name: Production acceptance
        run: python -m data_pipeline.validate
      - name: Live trading-day replay and production recovery drill
        env:
          TASK01_RECOVERY_ROOT: .
        run: python -m pytest -q tests/test_live_recovery.py
      - name: Package validated production
        run: |
          tar -czhf task01-validated.tar.gz data/raw data/clean data/current/acceptance.json metadata docs/datasets
      - name: Publish validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: task01-validated-data
          path: task01-validated.tar.gz
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Publish acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: task01-validation-report
          path: |
            metadata/acceptance.json
            metadata/history_progress.json
            metadata/history_progress.md
            metadata/manifest/gaps.json
            metadata/recovery_drill.json
            metadata/trading_day_replay.json
            metadata/effective_config.json
            metadata/manifest/history.json
            metadata/manifest/partitions.json
            metadata/capabilities/latest.json
            metadata/capabilities/history_ranges.json
            data/current/acceptance.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish accepted snapshot to Drive
        id: drive_publish
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m data_pipeline.drive_publish
      - name: Publish Drive publication evidence
        if: always() && steps.drive_publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task01-drive-publication-report
          path: metadata/drive_publish.json
          retention-days: 30
          if-no-files-found: error
      - name: Package recovery state, including unfinished work
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d metadata ]; then
            if [ -d data ]; then
              tar -czf task01-state.tar.gz data metadata
            else
              tar -czf task01-state.tar.gz metadata
            fi
          fi
      - name: Save recovery checkpoint
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task01-checkpoint
          path: task01-state.tar.gz
          retention-days: 90
          if-no-files-found: ignore
          compression-level: 0
  drive-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_drive_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test publication failure protection
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Restore published data from latest checkpoint
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=task01-checkpoint" > /tmp/task01-artifacts.json
          artifact_id=$(python - <<'PY'
          import json
          artifacts = json.load(open('/tmp/task01-artifacts.json'))['artifacts']
          available = sorted((a for a in artifacts if not a['expired']), key=lambda a: a['created_at'], reverse=True)
          if not available:
              raise SystemExit('No resumable checkpoint exists; upload blocked')
          print(available[0]['id'])
          PY
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/task01-checkpoint.zip
          unzip -p /tmp/task01-checkpoint.zip task01-state.tar.gz > /tmp/task01-state.tar.gz
          tar -xzf /tmp/task01-state.tar.gz
      - name: Revalidate, stage, verify remote bytes, and commit production pointer
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -m data_pipeline.drive_publish
      - name: Save credential-free publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: task01-drive-publication-report
          path: metadata/drive_publish.json
          retention-days: 30
          if-no-files-found: error
