name: Research engine CI

on:
  push:
    paths:
      - 'research_engine/**'
      - 'tests/test_research_engine.py'
      - '.github/workflows/research-ci.yml'
  pull_request:
    paths:
      - 'research_engine/**'
      - 'tests/test_research_engine.py'
      - '.github/workflows/research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test research engine
        run: python -m pytest -q tests/test_research_engine.py
